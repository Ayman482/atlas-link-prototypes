name: atlas_customer
description: "أطلس لينك — تطبيق العميل (Flutter، Android/iOS/Web). يتصل بخادم المحاكاة packages/mock-api."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  atlas_shared:
    path: ../atlas_shared
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.2.2

flutter:
  uses-material-design: true
  # خط لاتيني احتياطي لملف PDF للفاتورة (DejaVu Sans، رخصة Bitstream Vera الحرة)؛ الخط العربي من atlas_shared
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
