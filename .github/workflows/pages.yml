# نشر المعاينات على GitHub Pages عند كل دفع إلى main
name: Deploy previews to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm test
      - run: npm run preview:foundation
      - name: Assemble site
        run: |
          mkdir -p site/foundation
          cp apps/foundation-console/dist/standalone.html site/foundation/index.html
          cp apps/foundation-console/dist/standalone.html site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
